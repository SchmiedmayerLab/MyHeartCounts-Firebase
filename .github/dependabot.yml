version: 2
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
  - package-ecosystem: "npm"
    directories: ["/", "/functions"]
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    groups:
      npm-security-updates:
        applies-to: security-updates
        patterns: ["*"]
