[project]
name = "mhc-export"
version = "0.1.0"
description = "My Heart Counts HealthKit export pipeline: FHIR archives to anonymized Parquet"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pyarrow>=17",
  "numpy>=1.26",
  "duckdb>=1.1",
  "pytz>=2024.1",
  "zstandard>=0.23",
  "orjson>=3.10",
  "pydantic>=2.9",
  "google-cloud-storage>=2.18",
  "google-cloud-firestore>=2.19",
  "google-cloud-secret-manager>=2.21",
  "google-cloud-bigquery>=3.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
mhc-export = "mhc_export.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mhc_export"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
